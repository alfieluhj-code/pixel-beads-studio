<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Beads Studio Lite</title>
<style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#f8f2e8;background:#151c32}*{box-sizing:border-box}body{margin:0;padding:24px}header{text-align:center;margin-bottom:22px}h1{font-family:monospace;color:#ffda73;letter-spacing:2px;font-size:clamp(24px,4vw,38px);text-shadow:3px 3px #734b79}p{color:#c6d1ea}.app{max-width:1150px;margin:auto;display:grid;grid-template-columns:190px minmax(0,1fr) 230px;gap:16px}.panel{background:#263350;border:3px solid #6379a1;box-shadow:5px 5px 0 #0a1020;padding:15px;border-radius:3px}.panel h2{font:700 17px monospace;color:#ffda73;margin:0 0 14px}.control{display:block;margin:8px 0;font-weight:700;font-size:14px}button,select{background:#40577e;color:white;border:2px solid #8ca6d1;border-radius:2px;padding:10px;font:700 14px monospace;cursor:pointer}button:hover,select:hover{background:#536f9c}button:focus-visible,select:focus-visible,.cell:focus-visible{outline:3px solid #ffda73;outline-offset:2px}button.active{background:#e9b65e;color:#1a2035;border-color:#ffe8a3}button:disabled{opacity:.5;cursor:not-allowed}.buttons{display:grid;gap:9px}.board-panel{text-align:center;min-width:0}.board{display:grid;width:min(100%,560px);aspect-ratio:1;margin:14px auto;background:white;border:3px solid #d3dff4;touch-action:manipulation}.cell{min-width:0;min-height:0;border:1px solid #c7cbd2;background:white;padding:0;cursor:crosshair;outline-offset:-3px}.cell:hover{filter:brightness(.9)}.palette{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.swatch{aspect-ratio:1;min-width:0;padding:0;border:3px solid #8294b6}.swatch.selected{border-color:#ffe073;box-shadow:0 0 0 2px #ffe073}.stats{list-style:none;padding:0;margin:8px 0;max-height:250px;overflow:auto}.stats li{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:7px 0;font-size:13px}.dot{width:15px;height:15px;border:1px solid #ddd;display:inline-block;flex-shrink:0}.stat-label{margin-right:auto}.total{font-weight:800;color:#ffda73;margin-top:12px}.hint{font-size:12px;line-height:1.6}.bottom{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}@media(max-width:850px){.app{grid-template-columns:1fr}.board-panel{order:1}.tools{order:2}.colors{order:3}.palette{grid-template-columns:repeat(8,minmax(0,1fr))}body{padding:12px}.board{width:min(100%,500px)}}

.dialog-backdrop{position:fixed;inset:0;background:#080d1bc9;display:grid;place-items:center;z-index:20;padding:16px}.dialog-backdrop[hidden]{display:none}.dialog{width:min(100%,390px);background:#263350;border:3px solid #ffda73;box-shadow:7px 7px 0 #080d1b;padding:24px;text-align:center}.dialog h2{color:#ffda73;font:700 21px monospace}.dialog p{line-height:1.7}.dialog-actions{display:flex;gap:12px;justify-content:center}.dialog-actions button{min-width:105px}
</style>
</head>
<body>
<header><h1>★ PIXEL BEADS STUDIO ★</h1><p>選顏色、畫方格，做出自己的拼豆設計！</p></header>
<main class="app">
<section class="panel tools"><h2>▣ TOOLS 工具</h2><label class="control" for="size">畫布尺寸</label><select id="size" style="width:100%"><option value="16">16 × 16</option><option value="24">24 × 24</option><option value="32">32 × 32</option></select><div class="buttons" style="margin-top:16px"><button id="pen" class="active" type="button">✎ 畫筆</button><button id="eraser" type="button">▧ 橡皮擦</button><button id="clear" type="button">✕ 清空畫布</button></div><p class="hint">點一下方格就能填色。選擇橡皮擦可以清除顏色。切換尺寸會建立新畫布。</p></section>
<section class="panel board-panel"><h2>▦ CANVAS 畫布</h2><span id="dimension">16 × 16</span><div id="board" class="board" role="group" aria-label="拼豆繪圖方格"></div><div class="bottom"><button id="export" type="button">↓ 匯出 PNG 圖片</button></div></section>
<section class="panel colors"><h2>▤ COLORS 調色盤</h2><div id="palette" class="palette"></div><p id="chosen" class="hint" aria-live="polite">目前顏色：粉紅色</p><h2 style="margin-top:24px">▤ BEAD COUNT 統計</h2><ul id="stats" class="stats" aria-live="polite"><li>尚未使用拼豆</li></ul><p id="total" class="total">總顆數：0</p></section>
</main>
<div id="dialog" class="dialog-backdrop" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogText"><h2 id="dialogTitle">確認操作</h2><p id="dialogText"></p><div class="dialog-actions"><button id="cancelAction" type="button">取消</button><button id="confirmAction" type="button" class="active">確定</button></div></section></div>
<script>
'use strict';
const colors=[['粉紅','#F28AA9'],['紅色','#E95762'],['橘色','#F59A53'],['黃色','#F8D66D'],['淺綠','#B7D978'],['綠色','#58B889'],['淺藍','#91D8E8'],['藍色','#579BDE'],['紫色','#9876C9'],['薰衣草','#C5ADEA'],['棕色','#9B6B52'],['米色','#F4D6AC'],['白色','#FFFFFF'],['灰色','#A3A8B4'],['黑色','#30344C'],['深藍','#345080']];
const board=document.getElementById('board'),palette=document.getElementById('palette'),stats=document.getElementById('stats'),total=document.getElementById('total'),sizeSelect=document.getElementById('size');
let size=16,cells=Array(size*size).fill(null),selected=0,tool='pen';
function makePalette(){palette.replaceChildren();colors.forEach(([name,hex],i)=>{const b=document.createElement('button');b.type='button';b.className='swatch'+(selected===i?' selected':'');b.style.background=hex;b.title=name;b.setAttribute('aria-label','選擇'+name);b.setAttribute('aria-pressed',String(selected===i));b.addEventListener('click',()=>{selected=i;tool='pen';updateTools();makePalette();document.getElementById('chosen').textContent='目前顏色：'+name});palette.append(b)})}
function updateTools(){document.getElementById('pen').classList.toggle('active',tool==='pen');document.getElementById('eraser').classList.toggle('active',tool==='eraser')}
function paint(i){const newColor=tool==='eraser'?null:colors[selected][1];if(cells[i]===newColor)return;cells[i]=newColor;board.children[i].style.background=newColor||'#FFFFFF';board.children[i].setAttribute('aria-label',`第${Math.floor(i/size)+1}列第${i%size+1}格，${newColor||'空白'}`);updateStats()}
function drawBoard(){board.replaceChildren();board.style.gridTemplateColumns=`repeat(${size},minmax(0,1fr))`;document.getElementById('dimension').textContent=`${size} × ${size}`;const fragment=document.createDocumentFragment();cells.forEach((color,i)=>{const b=document.createElement('button');b.type='button';b.className='cell';b.style.background=color||'#FFFFFF';b.setAttribute('aria-label',`第${Math.floor(i/size)+1}列第${i%size+1}格，${color||'空白'}`);b.addEventListener('click',()=>paint(i));fragment.append(b)});board.append(fragment);updateStats()}
function updateStats(){const counts=new Map();cells.forEach(c=>{if(c)counts.set(c,(counts.get(c)||0)+1)});stats.replaceChildren();if(!counts.size){const li=document.createElement('li');li.textContent='尚未使用拼豆';stats.append(li)}else{[...counts.entries()].sort((a,b)=>b[1]-a[1]).forEach(([hex,count])=>{const li=document.createElement('li'),dot=document.createElement('span'),label=document.createElement('span'),num=document.createElement('strong');dot.className='dot';dot.style.background=hex;label.className='stat-label';label.textContent=(colors.find(c=>c[1]===hex)||['未知'])[0];num.textContent=count+' 顆';li.append(dot,label,num);stats.append(li)})}total.textContent='總顆數：'+[...counts.values()].reduce((a,b)=>a+b,0)}
document.getElementById('pen').addEventListener('click',()=>{tool='pen';updateTools()});document.getElementById('eraser').addEventListener('click',()=>{tool='eraser';updateTools()});
const dialog=document.getElementById('dialog');
let pendingAction=null;
function closeDialog(){dialog.hidden=true;pendingAction=null}
function askConfirmation(message,action){document.getElementById('dialogText').textContent=message;pendingAction=action;dialog.hidden=false;document.getElementById('cancelAction').focus()}
document.getElementById('cancelAction').addEventListener('click',closeDialog);
document.getElementById('confirmAction').addEventListener('click',()=>{const action=pendingAction;closeDialog();if(action)action()});
dialog.addEventListener('click',e=>{if(e.target===dialog)closeDialog()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.hidden)closeDialog()});
sizeSelect.addEventListener('change',()=>{const next=Number(sizeSelect.value);sizeSelect.value=String(size);if(next===size)return;askConfirmation('切換成 '+next+' × '+next+' 會清除目前圖案，確定繼續嗎？',()=>{size=next;sizeSelect.value=String(size);cells=Array(size*size).fill(null);drawBoard()})});
document.getElementById('clear').addEventListener('click',()=>{askConfirmation('確定要清空整張畫布嗎？此操作無法還原。',()=>{cells.fill(null);drawBoard()})});
document.getElementById('export').addEventListener('click',()=>{const step=20,canvas=document.createElement('canvas');canvas.width=size*step+1;canvas.height=size*step+1;const ctx=canvas.getContext('2d');if(!ctx){alert('無法建立圖片，請更換瀏覽器再試。');return}ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,canvas.width,canvas.height);cells.forEach((c,i)=>{ctx.fillStyle=c||'#FFFFFF';ctx.fillRect((i%size)*step,Math.floor(i/size)*step,step,step)});ctx.strokeStyle='#A8ADB8';ctx.lineWidth=1;ctx.beginPath();for(let n=0;n<=size;n++){let p=n*step+.5;ctx.moveTo(p,.5);ctx.lineTo(p,size*step+.5);ctx.moveTo(.5,p);ctx.lineTo(size*step+.5,p)}ctx.stroke();const a=document.createElement('a');a.download=`pixel-beads-${size}x${size}.png`;a.href=canvas.toDataURL('image/png');document.body.append(a);a.click();a.remove()});
makePalette();drawBoard();
</script>
</body></html>
